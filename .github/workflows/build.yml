name: Build EXE

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install @yao-pkg/pkg
        run: npm install -g @yao-pkg/pkg

      - name: Build EXE
        run: pkg .

      - name: Rename EXE
        run: mv dist\miditap.exe dist\MIDITap-${{ github.ref_name }}.exe        

      - name: Package zip
        run: |
          mkdir release
          copy dist\MIDITap-${{ github.ref_name }}.exe release\
          xcopy config release\config\ /E /I
          cd release
          Compress-Archive -Path * -DestinationPath ..\MIDITap-${{ github.ref_name }}.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: MIDITap-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}